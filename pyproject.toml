[project]
name = "vancouver-signals"
version = "0.1.0"
description = "Signals dataset and analytical framework tracking neighborhood change in Vancouver."
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "polars",
    "pyarrow",
    "geopandas",
    "shapely",
    "pyproj",
    "requests",
    "python-dotenv",
    "matplotlib",
    "plotly",
    "jupyter",
    "ipykernel",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["ANN", "E501"]
"tests/**" = ["ANN"]
